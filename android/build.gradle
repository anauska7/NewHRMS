// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Add the Android Gradle Plugin (AGP) classpath here
        classpath 'com.android.tools.build:gradle:7.3.0' // Or another version that is compatible with your setup
    }
}

plugins {
    id 'com.android.application' version '8.2.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Set root project build directory
rootProject.buildDir = "../build"

// Ensure all subprojects use the same build directory
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Evaluation dependency
subprojects {
    project.evaluationDependsOn(":app")
}

// Clean task to delete the build directory
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
